# docker-compose.yml
# ==================
#
# Streamlit-only deployment (OpenRouter). No Ollama / Jupyter / MCP ports.
#
#     cp .env.example .env   # set OPENROUTER_API_KEY
#     docker compose up --build
#     # http://localhost:8501

services:
  app:
    build: .
    container_name: codebase-assistant-ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      CODEBASE_ASSISTANT_DATA_DIR: /data
      CHROMA_PERSIST_DIR: /data/chroma
      MEMORY_STORE_PATH: /data/memory
      RUN_HISTORY_PATH: /data/history/ui_run_history.jsonl
    volumes:
      - ca_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  ca_data:
